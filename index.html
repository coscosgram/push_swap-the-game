<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muelle">
<title>Muelle Push Swap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&family=Special+Elite&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Concepto: muelle en pixel art. Grúas amarillas, cables de acero, LEDs, palancas, megafonía ámbar y notas impresas en papel continuo. */
:root{
  --bg:#cfcdc3;--grain:rgba(0,0,0,.07);--surface:#e2e0d6;--surface-2:#c6c7c0;--paper:#f4eed9;--paper-2:#e4dcbf;--hole:#cfcdc3;
  --ink:#1e2225;--ink-2:#525a60;--line:#80888d;--edge:#1e2225;--shadow:rgba(30,34,37,.5);
  --accent:#a8480a;--accent-ink:#1a1408;--hazard:#f5b800;--hazard-d:#9c6f00;--steel:#7d868c;--steel-d:#3b4248;--rivet:#8c9499;
  --good:#1b7a38;--bad:#b3261e;--led-g:#38d864;--led-r:#ff4538;--led-a:#ffb21a;
  --code-bg:#17191c;--code-fg:#e8e5d8;--floor:#b9bab2;--tear:#4fb6c9;--face-bg:#2c3135;
  --c1:#b5472a;--c2:#3f7f5c;--c3:#dc9b1c;--c4:#8c9196;
  --sk1:#f6e3b0;--sk2:#f2cf93;--sk3:#ebb87a;--wt1:#5b7573;--wt2:#4a6361;--wt3:#3c5352;--conc:#a9aaa2;--concd:#8f9088;--hull:#a53a25;--hulld:#7d2b1b;--cloud:#fff3d6;
  --bar-s:65%;--bar-l:42%;--bar-fg:#ffffff;
  --paper-ink:#2b2a26;
  --f-pix:"Pixelify Sans",system-ui,sans-serif;--f-body:"Pixelify Sans",system-ui,sans-serif;--f-mono:"Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--f-led:"VT323","Courier New",monospace;--f-paper:"Special Elite","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161a;--grain:rgba(255,255,255,.035);--surface:#22262b;--surface-2:#2d3339;--paper:#e6dec2;--paper-2:#d1c8a8;--hole:#14161a;
  --ink:#ecebe2;--ink-2:#a8afb4;--line:#5a636a;--edge:#3f474e;--shadow:rgba(0,0,0,.7);
  --accent:#ffb21a;--hazard:#ffc21a;--steel:#6b747a;--steel-d:#1b1e22;--rivet:#59626a;--good:#5fe08a;--bad:#ff6b5f;
  --code-bg:#0c0e10;--floor:#1d2024;--tear:#56c3d6;--face-bg:#101214;--c1:#c9553a;--c2:#4a9669;--c3:#e8aa2a;--c4:#9aa0a5;
  --sk1:#1b1a24;--sk2:#2a2029;--sk3:#3d2a2c;--wt1:#2b3f3e;--wt2:#22302f;--wt3:#1b2828;--conc:#3a3d40;--concd:#2d3033;--hull:#8e3322;--hulld:#64241a;--cloud:#3d3544;
  --bar-l:50%;--bar-fg:#101214;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161a;--grain:rgba(255,255,255,.035);--surface:#22262b;--surface-2:#2d3339;--paper:#e6dec2;--paper-2:#d1c8a8;--hole:#14161a;
  --ink:#ecebe2;--ink-2:#a8afb4;--line:#5a636a;--edge:#3f474e;--shadow:rgba(0,0,0,.7);
  --accent:#ffb21a;--hazard:#ffc21a;--steel:#6b747a;--steel-d:#1b1e22;--rivet:#59626a;--good:#5fe08a;--bad:#ff6b5f;
  --code-bg:#0c0e10;--floor:#1d2024;--tear:#56c3d6;--face-bg:#101214;--c1:#c9553a;--c2:#4a9669;--c3:#e8aa2a;--c4:#9aa0a5;
  --sk1:#1b1a24;--sk2:#2a2029;--sk3:#3d2a2c;--wt1:#2b3f3e;--wt2:#22302f;--wt3:#1b2828;--conc:#3a3d40;--concd:#2d3033;--hull:#8e3322;--hulld:#64241a;--cloud:#3d3544;
  --bar-l:50%;--bar-fg:#101214;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body,button,input,select{font-variant-ligatures:none}
*,*::before,*::after{border-radius:0!important}
body{background:var(--bg);background-image:radial-gradient(var(--grain) 1px,transparent 1.5px);background-size:8px 8px;color:var(--ink);font:17px/1.5 var(--f-body);padding-block:12px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h2,h3,h4{font-family:var(--f-pix);font-weight:600;text-wrap:balance}
button{font:inherit;color:inherit}
svg{shape-rendering:crispEdges}
:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
code{font:13px var(--f-code);background:var(--surface-2);padding:1px 5px}
/* cabecera */
.top{display:flex;gap:14px 28px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;background:var(--surface);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--shadow);position:relative}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand h1{font:24px/1.3 var(--f-pix);margin:0;color:var(--ink);text-shadow:3px 3px 0 var(--hazard);text-transform:uppercase}
.brand small{display:block;font:17px/1.2 var(--f-led);color:var(--ink-2);margin-top:8px;letter-spacing:.02em}
.prog{display:flex;flex-direction:column;gap:5px;min-width:min(260px,100%);font:16px var(--f-led);color:var(--ink-2);letter-spacing:.04em}
.prog div:first-child{display:flex;justify-content:space-between;gap:12px}
.meter{height:16px;background:var(--steel-d);border:3px solid var(--edge);position:relative}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.55) 8px 10px);pointer-events:none}
.meter i{display:block;height:100%;width:0;background:var(--led-a);transition:width .4s steps(10)}
/* remaches */
.riv{position:relative}
.riv::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--rivet),var(--rivet)) left 5px top 14px/4px 4px no-repeat,linear-gradient(var(--rivet),var(--rivet)) right 5px top 14px/4px 4px no-repeat,
  linear-gradient(var(--rivet),var(--rivet)) left 5px bottom 5px/4px 4px no-repeat,linear-gradient(var(--rivet),var(--rivet)) right 5px bottom 5px/4px 4px no-repeat}
/* navegación */
.shell{display:flex;flex-direction:column;gap:22px;margin-top:22px}
.nav{position:relative;z-index:5}
.nav button{display:flex;gap:10px;align-items:center;text-align:left;border:3px solid var(--edge);background:var(--surface);padding:8px 12px;cursor:pointer;width:100%}
.nav button:hover{background:var(--surface-2)}
.nav .n{font:700 21px var(--f-pix);color:#1b1b1b;width:28px;height:28px;display:grid;place-items:center;background:var(--hazard);border:2px solid var(--edge);flex:0 0 auto}
.nav .t{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.2}
.nav .t small{display:block;font-weight:400;font-size:15px;color:var(--ink-2)}
.nav .st{font:16px var(--f-led);color:var(--ink-2)}
.nav button.complete .st{color:var(--good)}
.nav button[aria-current="true"]{background:var(--steel-d);color:#f1efe4;border-color:var(--hazard)}
.nav button[aria-current="true"] .t small,.nav button[aria-current="true"] .st{color:#c9cdd0}
.menu summary{list-style:none;display:flex;gap:12px;align-items:center;border:3px solid var(--edge);background:var(--surface);padding:8px 12px;cursor:pointer;box-shadow:4px 4px 0 var(--shadow)}
.menu summary::-webkit-details-marker{display:none}
.menu summary .n{font:700 21px var(--f-pix);color:#1b1b1b;width:28px;height:28px;display:grid;place-items:center;background:var(--hazard);border:2px solid var(--edge);flex:0 0 auto}
.menu summary .t{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.2}
.menu summary .t small{display:block;font-weight:400;font-size:15px;color:var(--ink-2)}
.menu summary .st,.menu summary .car{font:17px var(--f-led);color:var(--ink-2);white-space:nowrap}
.menu summary .car{background:var(--hazard);color:#1b1b1b;padding:1px 8px;border:2px solid var(--edge)}
.menu[open] summary{border-color:var(--hazard)}
.mlist{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--bg);border:3px solid var(--edge);padding:8px;display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto;box-shadow:6px 6px 0 var(--shadow)}
.panel{display:flex;flex-direction:column;gap:24px;min-width:0}
.mn{font:16px var(--f-pix);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mh h2{font:700 clamp(24px,5.5vw,36px)/1.15 var(--f-pix);text-transform:uppercase;margin:8px 0 6px;color:var(--ink);text-shadow:2px 2px 0 var(--hazard)}
.sub{margin:0;color:var(--ink-2)}
/* megafonía */
.radio{display:grid;grid-template-columns:auto 1fr;gap:14px;background:#17191b;color:#ffc247;border:3px solid var(--edge);padding:22px 16px 16px;box-shadow:4px 4px 0 var(--shadow)}
.radio::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#1b1b1b 10px 20px)}
.spk{width:64px;flex:0 0 auto;padding-top:4px}
.spk svg{width:100%;display:block}
.spk .wv{animation:wave 1s steps(1) infinite}.spk .wv2{animation-delay:.33s}.spk .wv3{animation-delay:.66s}
@keyframes wave{0%{opacity:.15}33%{opacity:1}100%{opacity:.15}}
.pa-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font:14px/1.6 var(--f-pix);letter-spacing:.04em;color:#c9c3a8}
.pa-h small{font:16px var(--f-led);letter-spacing:.02em;color:#8d907f}
.led{display:inline-block;width:10px;height:10px;background:var(--led-r);box-shadow:0 0 8px var(--led-r);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.25;box-shadow:none}}
.radio p{margin:6px 0 0;font:22px/1.25 var(--f-led);letter-spacing:.03em;text-shadow:0 0 7px rgba(255,178,26,.45);max-width:74ch}
.radio p.chime{font:22px var(--f-pix);color:#ffe29a;margin:10px 0 0;letter-spacing:.1em}
.radio p.clic{font-size:17px;color:#8d907f;text-shadow:none;margin-top:6px}
.radio i{font-style:normal;color:#8ff0a4;text-shadow:0 0 7px rgba(143,240,164,.4)}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec h3{margin:0;font-size:12px;line-height:1.6;text-transform:uppercase;padding-bottom:12px;background:repeating-linear-gradient(135deg,var(--steel) 0 3px,var(--steel-d) 3px 6px) left bottom/100% 6px no-repeat}
/* notas en papel continuo */
.sec>p,.goal,.term,.card,.q,.checks label{font:15px/1.5 var(--f-paper);color:var(--paper-ink);background:var(--paper);box-shadow:3px 3px 0 var(--shadow)}
.sec>p{max-width:72ch;padding:12px 14px 12px 40px;position:relative;margin:0;
  background:radial-gradient(circle at 11px 11px,var(--hole) 4px,transparent 4.5px) 0 0/26px 22px repeat-y,
  repeating-linear-gradient(180deg,#a89f82 0 4px,transparent 4px 8px) 27px 0/1px 100% no-repeat,
  linear-gradient(90deg,var(--paper-2) 0 27px,transparent 27px),var(--paper)}
.sec>p code,.term code,.card code{background:var(--paper-2);color:var(--paper-ink)}
.sec>p i{font-style:normal;background:linear-gradient(transparent 55%,rgba(245,184,0,.5) 55%)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.card{padding:16px 14px 12px;position:relative;border-bottom:3px dashed #a89f82}
.card::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;background:var(--led-r);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 3px 0 rgba(0,0,0,.25)}
.card:nth-child(odd){transform:rotate(-.5deg)}.card:nth-child(even){transform:rotate(.4deg)}
.card h4{margin:0 0 8px;font:16px/1.5 var(--f-pix);text-transform:uppercase;color:var(--paper-ink)}
.card p{margin:0;font-size:14px}
.term{max-width:72ch;padding:10px 14px;border:2px dashed #8f876c}
.term b{font:14px var(--f-pix);text-transform:uppercase;letter-spacing:.04em;margin-right:8px;background:var(--paper-ink);color:var(--paper);padding:3px 6px;display:inline-block;margin-bottom:4px}
.goal{padding:10px 14px;border-left:8px solid var(--hazard)}
.goal .mono{font:13px var(--f-paper);color:#6a644f}
pre.code{background:var(--code-bg);color:var(--code-fg);border:3px solid var(--edge);padding:12px 14px;overflow-x:auto;font:13px/1.55 var(--f-code);margin:0;box-shadow:3px 3px 0 var(--shadow);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px)}
.code .c{color:#8a9096}.code .s{color:#c9d98a}.code .k{color:#ffb454}.code .t{color:#7fd6b8}.code .n{color:#f0cf6a}
.code .blank{background:#d9461f;color:#fff;padding:0 6px}
.btn{font:16px/1.4 var(--f-pix);background:var(--hazard);color:#1b1b1b;border:3px solid var(--edge);padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 var(--hazard-d),0 4px 0 3px var(--edge);margin-bottom:4px;text-transform:uppercase}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--hazard-d),0 1px 0 3px var(--edge)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--steel),0 4px 0 3px var(--edge)}
.btn:disabled{opacity:.5;cursor:default}
/* paneles de metal */
.sim,.tool,.stat,.track{background:var(--surface);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--shadow);position:relative}
.sim,.tool{padding:20px 14px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sim::before,.track::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#1b1b1b 10px 20px)}
.sim-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.count{font:17px var(--f-led);color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase}
.count b{font:32px var(--f-pix);margin:0 8px;background:var(--steel-d);color:var(--led-a);padding:4px 8px;border:2px solid var(--edge);display:inline-block;letter-spacing:.04em}
.status{font:18px var(--f-led);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.status::before{content:"";width:10px;height:10px;background:var(--led-a);box-shadow:0 0 6px var(--led-a)}
.status.ok{color:var(--good)}.status.ok::before{background:var(--led-g);box-shadow:0 0 8px var(--led-g)}
.stacks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stacks.shake{animation:sh .25s steps(4)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.col{min-width:0}
.col h4{margin:0 0 8px;font:13px/1.5 var(--f-pix);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.stack{height:300px;background-color:var(--floor);border:3px solid var(--edge);border-bottom:8px solid var(--hazard);padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 38px,rgba(0,0,0,.08) 38px 40px)}
.stack.big{gap:0}
.bar{flex:1 1 0;max-height:34px;min-height:1px;border:0;background:hsl(var(--h) var(--bar-s) var(--bar-l));color:var(--bar-fg);display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 6px;font:600 15px var(--f-mono);overflow:hidden;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 8px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.18)}
.bar .lab{display:flex;align-items:center;gap:5px;min-width:0}
.bar .lab svg{height:20px;width:auto;flex:0 0 auto}
.bar .bin{font-weight:400;font-size:13px;opacity:.85;font-family:var(--f-code)}
button.bar{cursor:pointer;min-height:30px;flex:0 0 auto}
.empty{margin:auto;color:var(--ink-2);font:17px var(--f-led)}
.gantry{height:26px;border-bottom:4px solid var(--hazard-d);position:relative;margin-top:-2px;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.15) 10px 12px)}
.gantry i{position:absolute;top:0;left:25%;width:3px;height:20px;background:var(--steel-d);transition:left .25s steps(5)}
.gantry i::after{content:"";position:absolute;left:-8px;bottom:-4px;width:19px;height:10px;background:var(--hazard);border:2px solid var(--edge)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.og{display:flex;flex-direction:column;gap:6px}
.og small{font:13px var(--f-pix);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.og div{display:flex;gap:8px;flex-wrap:wrap}
.op{font:16px var(--f-pix);padding:9px 10px 9px 8px;border:3px solid var(--edge);background:var(--steel-d);color:#f1efe4;cursor:pointer;min-width:54px;display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 0 #000;margin-bottom:4px}
.op::before{content:"";width:8px;height:8px;background:var(--led-r);box-shadow:0 0 5px var(--led-r)}
.op:hover{background:var(--steel)}
.op:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.op:active::before{background:var(--led-g);box-shadow:0 0 6px var(--led-g)}
.log{display:flex;flex-wrap:wrap;gap:4px;min-height:24px;font:15px var(--f-led)}
.log span{background:var(--steel-d);color:var(--led-a);padding:0 6px;border:1px solid var(--edge)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel,.inp{font:16px var(--f-mono);padding:7px 10px;border:3px solid var(--edge);background:var(--paper);color:var(--paper-ink);min-width:0}
.inp{flex:1 1 220px}
.lbl{font:14px var(--f-pix);letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:3px solid var(--edge);background:var(--surface);padding:7px 12px;cursor:pointer;font:16px var(--f-pix)}
.tab[aria-pressed="true"]{background:var(--hazard);color:#1b1b1b}
.tab.ok::after{content:" ✓"}
.res{padding:10px 12px;font:15px/1.5 var(--f-paper);border:3px solid var(--edge);background:var(--paper);color:var(--paper-ink)}
.res.good{border-color:var(--good)}.res.bad{border-color:var(--bad)}
.res b{font-family:var(--f-code)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font:16px var(--f-mono)}
.tbl th,.tbl td{padding:6px 8px;border-bottom:2px solid var(--line);text-align:left;white-space:nowrap}
.tbl tr.best td{background:color-mix(in srgb,var(--good) 22%,transparent)}
.q{padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.q::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:repeating-linear-gradient(90deg,var(--paper-ink) 0 6px,transparent 6px 12px);opacity:.25}
.qh{display:flex;justify-content:space-between;font:13px var(--f-pix);letter-spacing:.04em;text-transform:uppercase;color:#6a644f}
.qt{margin:0;font-weight:700;font-size:16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:3px solid var(--paper-ink);background:#fffbea;color:var(--paper-ink);padding:8px 12px;cursor:pointer;font:15px/1.4 var(--f-paper)}
.opt:hover:not(:disabled){background:var(--hazard)}
.opt.right{border-color:var(--good);background:#cfe9bf}
.opt.wrong{border-color:var(--bad);background:#f3c9c1;opacity:.85}
.fb{font:15px/1.45 var(--f-paper);min-height:1px}.fb.ok{color:#1b6a32}
.fb i{font-style:normal;display:block;margin-top:6px;padding:6px 10px;background:#17191c;color:#ffc247;font:19px/1.2 var(--f-led);letter-spacing:.03em}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:15px var(--f-code)}
.chain .nd{display:inline-flex;border:3px solid var(--edge);overflow:hidden;background:var(--surface)}
.chain .nd i{font-style:normal;padding:5px 10px}.chain .nd i+i{border-left:3px solid var(--edge);background:var(--hazard);color:#1b1b1b}
.chain .ptr{border:3px dashed var(--accent);padding:5px 10px;color:var(--accent);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#17191c;color:#ffc247;padding:8px 16px;border:3px solid var(--hazard);font:20px var(--f-led);letter-spacing:.04em;z-index:20}

.harbor{margin-top:16px;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--shadow);overflow:hidden;height:144px;background:var(--sk1)}

.harbor .w1{animation:drift 8s steps(12) infinite}.harbor .w2{animation:drift 12s steps(12) infinite reverse}
.harbor .cl{animation:drift 40s linear infinite alternate}
.harbor .hang{animation:bob 2s steps(2) infinite alternate}
.harbor .bl{animation:blink 1.4s steps(1) infinite}
@keyframes drift{to{transform:translateX(-72px)}}
@keyframes bob{to{transform:translateY(6px)}}

.track{margin-top:18px;padding:22px 16px 10px;overflow:hidden}
.tr-top{display:flex;gap:16px;align-items:center;padding-top:4px}
.tr-icon{flex:0 0 auto;width:92px;height:92px;background:var(--steel-d);border:3px solid var(--edge);display:grid;place-items:center;color:#f1efe4;box-shadow:inset 0 0 0 3px rgba(255,255,255,.06)}

.tr-msg{min-width:0}
#tl{display:block;font:700 clamp(24px,5vw,38px)/1.1 var(--f-pix);text-transform:uppercase;margin-top:6px}

.tm i{font-style:normal;color:var(--accent);display:block;margin-top:2px}
.tears-title{display:flex;align-items:center;gap:8px;margin-top:16px;font:14px var(--f-pix);letter-spacing:.04em;color:var(--ink-2)}
.tears-row{display:flex;gap:14px;align-items:center;margin-top:8px}
.face{flex:0 0 auto;width:104px;height:104px;border:3px solid var(--edge);background:var(--face-bg);box-shadow:4px 4px 0 var(--shadow);position:relative}
.face svg{width:100%;height:100%;display:block}
.face.cry{animation:sob .5s steps(2) infinite}
@keyframes sob{50%{transform:translateY(3px)}}
.tears{position:relative;flex:1;min-width:0;height:64px;border:3px solid var(--edge);background:var(--steel-d);overflow:hidden}
.tfill{position:absolute;inset:0 auto 0 0;width:0;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--tear) 70%,#fff) 0 30%,var(--tear) 30%);transition:width .9s steps(12)}
.tfill::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)),linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45));background-size:6px 6px,6px 6px;background-position:10px 8px,34px 38px;background-repeat:no-repeat;animation:fizz 2.4s steps(6) infinite}
@keyframes fizz{to{transform:translateY(-12px)}}
.tears::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,0,0,.45) 14px 16px);pointer-events:none}
.tdrop{position:absolute;right:6px;top:50%;margin-top:-14px;width:21px;height:28px;animation:bob2 1s steps(2) infinite alternate;z-index:1}
@keyframes bob2{to{transform:translateY(5px)}}
.tpct{position:absolute;inset:0;display:grid;place-items:center;font:26px var(--f-pix);color:#fff;text-shadow:2px 2px 0 #000;z-index:2}
.tlabels{display:flex;justify-content:space-between;font:16px var(--f-led);color:var(--ink-2);margin:4px 0 0 118px}
.tmarks{position:relative;height:50px;margin:8px 16px 4px 134px}
.mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.mk i{display:block;width:3px;height:6px;background:var(--ink-2)}
.mk svg{width:28px;height:28px}
.mk.past{opacity:.35;filter:grayscale(1)}
.mk.now svg{width:42px;height:42px}
.track.hit{animation:sh .35s steps(4)}
@media(max-width:620px){
  .face{width:76px;height:76px}.tears{height:50px}.tr-icon{width:72px;height:72px}.tr-icon svg{width:54px;height:54px}
  .tlabels{margin-left:90px}.tmarks{margin:8px 10px 4px 90px}.mk svg{width:22px;height:22px}.mk.now svg{width:32px;height:32px}
  .radio{grid-template-columns:1fr}.spk{width:44px}
  .stacks{gap:10px}.brand h1{font-size:15px;text-shadow:2px 2px 0 var(--hazard)}
}
@media(prefers-reduced-motion:reduce){.tfill{transition:none}.tfill::after,.tdrop,.led,.spk .wv,.face.cry,.harbor *{animation:none!important}.track.hit{animation:none}.meter i,.gantry i{transition:none}.stacks.shake{animation:none}}

<div class="toast" id="toast" hidden></div>
<script>
(()=>{
'use strict';
const KEY='muelle-push-swap-v1';
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let progress={done:{},last:0};
try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&p.done)progress=p;}catch(e){}
progress.fails=progress.fails||0;

const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const WRONG=[
  'ATENCIÓN. Se ha caído una gráfica. Un gamer baja de resolución y no sabe por qué.',

  'ATENCIÓN. Interesante intento. Lo estudiaremos en el museo de intentos interesantes.'
];
const PRAISE=[
  'CORRECTO. Sin abrir la pestaña de la IA. Impresionante.',
  'BIEN. Los gamers respiran y la resolución aguanta otro día.',

];
const OVER=[
  'AVISO. Resuelto, sí, pero con más maniobras de las necesarias. Los gamers esperan con el mando en la mano.',
  'ATENCIÓN. Funciona. Es feo. Pero funciona. Como el código que «te ayudó un poco».',
  'COMUNICADO. Lo has logrado… despacio. Los gamers han cambiado de hobby mientras tanto.'
];
const LEVELS=[
  {n:'8K',r:'resolución 8K',k:'k8',j:'8K: se ve tanto que hasta se nota que el protagonista no se ha afeitado.'},
  {n:'4K',r:'resolución 4K',k:'m1',j:'4K: más píxeles de los que el ojo necesita, pero los gamers lo reclamarán igual.'},
  {n:'1080p',r:'resolución 1080p',k:'k1080',j:'1080p, ni tan mal. Tampoco es que los gamers tengan la vista perfecta.'},
  {n:'480p',r:'resolución 480p',k:'dvd',j:'Tal resolución bajita… al menos ya no se ven los defectos visuales.'},
  {n:'144p',r:'resolución 144p',k:'gb',j:'144p: han confundido los 144 Hz del monitor con los 144 píxeles de alto. Error de principiante.'},
  {n:'Pixel art',r:'resolución pixel art',k:'px',j:'Pixel art: los gamers ya no saben si están jugando a GTA VI o al primer Mario.'},

];
const TEARS_PER=7;
const tearsPct=()=>Math.min(100,progress.fails*TEARS_PER);
const lvl=()=>Math.min(LEVELS.length-1,Math.floor(tearsPct()/(100/(LEVELS.length-1))+1e-9));
// ---------- pixel art ----------
const PX=(w,h,body,cls)=>`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"${cls?` class="${cls}"`:''}>${body}</svg>`;
const rc=(x,y,w,h,f,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${c?` class="${c}"`:''}/>`;
const GLY={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111','K':'101101110101101','P':'111101111100100','R':'110101110101101','A':'010101111101101','M':'101111111101101','G':'011100101101011','U':'101101101101111'};
function txt(s,x,y,u,f){let o='';[...String(s).toUpperCase()].forEach((ch,i)=>{const g=GLY[ch];if(!g)return;for(let k=0;k<15;k++)if(g[k]==='1')o+=rc(x+(i*4+k%3)*u,y+Math.floor(k/3)*u,u,u,f);});return o;}
function monPx(label,col,u,extra){
  const w=(label.length*4-1)*u,x=2+Math.floor((36-w)/2),y=2+Math.floor((21-5*u)/2);
  return PX(40,30,rc(0,0,40,25,'#c9cdd0')+rc(0,22,40,3,'#9aa0a5')+rc(2,2,36,20,'#0e1311')+rc(2,2,36,2,'rgba(255,255,255,.08)')+txt(label,x,y,u,col)+(extra||'')+rc(35,23,2,1,'#38d864')+rc(16,25,8,3,'#9aa0a5')+rc(10,28,20,2,'#c9cdd0'));
}
function discPx(){
  let o='';
  for(let y=0;y<24;y++){let run='',x0=0;
    const flush=x=>{if(run)o+=rc(x0,y,x-x0,1,run);run='';};
    for(let x=0;x<24;x++){
      const dx=x+.5-12,dy=y+.5-12,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);let c='';
      if(d<=11.8&&d>=2.6){c=d<5?'#aab0b4':d>11?'#7d868c':'#dfe3e6';
        if(d>5.5&&d<10.8){if(a>-1.5&&a<-.8)c='#ffd34d';else if(a>-.8&&a<-.2)c='#ff8fb0';else if(a>1.6&&a<2.3)c='#7fd6b8';}}
      if(c!==run){flush(x);run=c;x0=x;}
    }
    flush(24);
  }
  return PX(24,24,o);
}
const gbPx=()=>PX(20,28,rc(1,0,18,28,'#2a2f33')+rc(0,1,20,26,'#2a2f33')+rc(2,1,16,26,'#cfccbd')+rc(1,2,18,24,'#cfccbd')+rc(3,3,14,10,'#5d6470')+rc(5,5,10,6,'#9bbc0f')+rc(6,6,2,1,'#306230')+rc(9,8,4,1,'#306230')+rc(6,9,3,1,'#306230')+rc(4,17,5,1,'#2a2f33')+rc(6,15,1,5,'#2a2f33')+rc(13,19,2,2,'#b5472a')+rc(15,17,2,2,'#b5472a')+rc(11,24,1,2,'#9a978a')+rc(13,23,1,2,'#9a978a')+rc(15,22,1,2,'#9a978a'));
const heartPx=()=>PX(9,8,rc(1,0,3,1,'#e0412f')+rc(5,0,3,1,'#e0412f')+rc(0,1,9,3,'#e0412f')+rc(1,4,7,1,'#e0412f')+rc(2,5,5,1,'#e0412f')+rc(3,6,3,1,'#e0412f')+rc(4,7,1,1,'#e0412f')+rc(1,1,2,1,'#ff9a8a')+rc(1,2,1,1,'#ff9a8a')+rc(1,4,1,1,'#a52a1e')+rc(2,5,1,1,'#a52a1e')+rc(3,6,1,1,'#a52a1e')+rc(7,3,1,1,'#a52a1e'));
const toastPx=()=>PX(26,19,rc(5,0,6,8,'#d9a24a')+rc(5,0,6,1,'#f0c878')+rc(6,1,1,2,'#8a5a1c')+rc(14,0,6,8,'#c98a3a')+rc(14,0,6,1,'#f0c878')+rc(15,1,1,2,'#8a5a1c')+rc(1,6,22,11,'#2a2f33')+rc(2,7,20,9,'#b9bec2')+rc(2,7,20,2,'#e3e6e8')+rc(4,7,8,1,'#2a2f33')+rc(13,7,8,1,'#2a2f33')+rc(2,14,20,2,'#7d868c')+rc(17,11,2,2,'#ff4538')+rc(23,9,3,2,'#2a2f33')+rc(3,17,3,2,'#2a2f33')+rc(19,17,3,2,'#2a2f33'));
const RAMI=PX(16,8,rc(0,0,16,6,'#d8dcdf')+rc(1,1,3,4,'#1e2225')+rc(5,1,3,4,'#1e2225')+rc(9,1,3,4,'#1e2225')+rc(13,1,2,4,'#1e2225')+rc(0,6,7,2,'#e8b923')+rc(9,6,7,2,'#e8b923'));
const GPUI=PX(18,8,rc(0,0,16,6,'#2a2f33')+rc(1,1,5,4,'#9aa0a5')+rc(3,2,1,2,'#2a2f33')+rc(7,1,5,4,'#9aa0a5')+rc(9,2,1,2,'#2a2f33')+rc(13,1,2,4,'#e8b923')+rc(16,0,2,7,'#c9cdd0')+rc(1,6,12,2,'#e8b923'));
const SPK=PX(17,14,rc(0,4,3,6,'#9aa0a5')+rc(3,3,2,8,'#c9cdd0')+rc(5,2,2,10,'#ffc21a')+rc(7,1,2,12,'#ffc21a')+rc(9,0,1,14,'#e0a800')+rc(11,4,1,6,'#ffc247','wv')+rc(13,2,1,10,'#ffc247','wv wv2')+rc(15,0,1,14,'#ffc247','wv wv3'));
function icon(k){
  switch(k){
    case 'k8':return monPx('8K','#ffd34d',3,rc(31,4,1,3,'#fff')+rc(30,5,3,1,'#fff')+rc(5,17,1,1,'#fff'));

function faceSVG(l){
  const D='#1e2225',S='#f2c391',H='#2a2118',Y='#ffc21a',T='#7fdcf0',W='#fff',R='#e0412f',P='#f08c8c';

  if(l===5)o+=rc(4,7,3,1,D)+rc(9,7,3,1,D)+brows+rc(5,8,1,5,T)+rc(10,8,1,5,T)+rc(4,9,1,2,T)+rc(11,9,1,2,T)+rc(5,11,1,1,D)+rc(6,10,1,1,D)+rc(7,11,2,1,D)+rc(9,10,1,1,D)+rc(10,11,1,1,D);

function fail(n){
  const a=lvl();progress.fails+=n||1;save();gauges();
  const b=lvl(),t=document.getElementById('track');
  if(t){t.classList.remove('hit');void t.offsetWidth;t.classList.add('hit');}
  if(b>a)toast('Lágrimas al '+tearsPct()+' % · '+LEVELS[b].n);

function gauges(){
  const mk=document.getElementById('stops');if(!mk)return;
  const l=lvl(),n=LEVELS.length-1,t=tearsPct(),X=LEVELS[l],tl=document.getElementById('tl'),ti=document.getElementById('ti'),fc=document.getElementById('face');
  if(!mk.children.length)mk.innerHTML=LEVELS.map((x,i)=>`<div class="mk" style="left:${i/n*100}%" title="${x.n}"><i></i>${icon(x.k)}</div>`).join('');

function checkArgs(str){
  const t=str.trim();
  if(!t)return{ok:true,none:true,msg:'Sin argumentos: no imprime nada y devuelve el control a la terminal.'};
  const tok=t.split(/\s+/),seen=new Set(),nums=[];
  for(const x of tok){
    if(!/^[+-]?\d+$/.test(x))return{ok:false,msg:`«${esc(x)}» no es un entero válido (sólo dígitos con un signo opcional).`};
    const v=BigInt(x);
    if(v<-2147483648n||v>2147483647n)return{ok:false,msg:`«${esc(x)}» no cabe en un int (de −2147483648 a 2147483647).`};
    const k=v.toString();if(seen.has(k))return{ok:false,msg:`«${esc(x)}» está repetido (+5 y 5 son el mismo número).`};
    seen.add(k);nums.push(Number(v));
  }
  return isSorted(nums)?{ok:true,msg:'Válido y ya ordenado: no imprime nada.'}:{ok:true,msg:'Válido: pasa a la fase de ordenar.'};
}

{

        return ;
    first = *lst;
    second = first->next;
    first->next = second->next;
    second->next = first;

static void push(t_node **src, t_node **dst)

  sec(root,'En detalle',`<p><b>1. Normalizar:</b> cambia cada valor por su posición en la lista ordenada (0, 1, 2…). Así no hay negativos ni números enormes y el número de pasadas depende sólo de cuántos son: los bits de <code>n-1</code>.</p>`);

    const v=nb.querySelector('#nz-in').value.trim().split(/\s+/).map(Number).filter(Number.isFinite);

    const sorted=[...v].sort((a,b)=>a-b),bits=bitLen(v.length);
    o.innerHTML=`<table class="tbl"><tr><th>valor</th><th>índice</th><th>binario (${bits} bits)</th></tr>${v.map(x=>{const r=sorted.indexOf(x);return `<tr><td>${x}</td><td>${r}</td><td>${r.toString(2).padStart(bits,'0')}</td></tr>`;}).join('')}</table>`;
    if(v.length>=3)markDone('m6.norm');
  };
  const s2=sec(root,'Mira cómo trabaja el radix','<p>Pulsa «Ver solución». Con pocos contenedores verás el índice en binario sobre cada barra.</p>');
  const tabs=el('div','tabs');s2.append(tabs);

  compare(root.lastChild,[['radix',100],['radix',500]]);
  root.lastChild.append(el('p','','El radix suele quedar en un aprobado cómodo, pero no llega a la nota máxima. Para eso existe la siguiente misión.'));
  quiz(root,'m6',[
    {q:'¿Para qué se normaliza antes del radix?',o:['Para que el programa sea más rápido','Para trabajar con índices 0…n-1: sin negativos y con las pasadas determinadas por n','Para eliminar duplicados','Porque lo pide la Norma'],a:1,e:'Con los valores originales los negativos y los números grandes complicarían los bits.'},
    {q:'Con 100 números, ¿cuántas pasadas (bits) hace como máximo?',o:['5','7','10','100'],a:1,e:'El mayor índice es 99, que en binario necesita 7 bits.'},
    {q:'En una pasada, ¿qué haces con el elemento de arriba cuyo bit actual es 0?',o:['ra','pb','sa','rra'],a:1,e:'Los de bit 0 se van a B; los de bit 1 giran con <code>ra</code>.'},
    {q:'¿Un radix simple llega a la nota máxima con 100 números?',o:['Sí, siempre','No, suele rondar los mil movimientos','Sólo si hay pocos duplicados','Sólo con rr'],a:1,e:'Cada pasada cuesta más de n movimientos, así que el total no baja de lo que pide la nota máxima.'}

function costGame(root){
  const box=el('div','tool');root.append(box);
  let st,streak=0;
  function round(){
    const v=randList(9),A=v.slice(0,6),bs=v.slice(6).sort((x,y)=>y-x),r=rnd(3);
    st={A,B:bs.slice(r).concat(bs.slice(0,r)),picked:null};draw();
  }
  function draw(){
    const all=[...st.A,...st.B].sort((a,b)=>a-b),rank=new Map(all.map((x,i)=>[x,i])),N=all.length;
    box.innerHTML=`<p class="lbl">Aciertos: ${Math.min(streak,3)}/3 · Pulsa el contenedor de A más barato de pasar a B.</p>
    <div class="stacks"><div class="col"><h4><span>Muelle A</span><span>↑ cima</span></h4><div class="stack" data-k="a">${barsHTML(st.A,rank,N,0,!st.picked)}</div></div>
    <div class="col"><h4><span>Muelle B (de mayor a menor, en círculo)</span></h4><div class="stack">${barsHTML(st.B,rank,N,0)}</div></div></div><div data-k="r"></div>`;
    box.querySelectorAll('button.bar').forEach(b=>{b.onclick=()=>pick(+b.dataset.i);});
    if(st.picked!=null)result();
  }
  function pick(i){st.picked=i;const c=costsAtoB(st.A,st.B),min=Math.min(...c.map(x=>x.p.c));if(c[i].p.c===min){streak++;if(streak>=3)markDone('m7.cost');}else{streak=0;toast(pickOne(WRONG));fail();}draw();}
  const how={rr:'rr (ambas suben)',rrr:'rrr (ambas bajan)',ra_rrb:'A sube, B baja',rra_rb:'A baja, B sube'};
  function result(){
    const c=costsAtoB(st.A,st.B),min=Math.min(...c.map(x=>x.p.c)),ok=c[st.picked].p.c===min,r=box.querySelector('[data-k=r]');
    r.innerHTML=`<div class="res ${ok?'good':'bad'}"><b>${ok?'✔ Correcto':'No era ese'}</b> · el coste mínimo es ${min}.</div>
    <div class="scroll"><table class="tbl"><tr><th>contenedor</th><th>va sobre…</th><th>coste</th><th>cómo</th></tr>${c.map(x=>`<tr class="${x.p.c===min?'best':''}"><td>${x.v}</td><td>${x.tv}</td><td>${x.p.c}</td><td>${how[x.p.k]}</td></tr>`).join('')}</table></div>
    <p class="lbl">«Va sobre…» es el valor de B que debe quedar en la cima: el mayor que sea menor que el contenedor (o el máximo de B si no hay ninguno).</p><div class="row"><button class="btn" type="button">Otra ronda</button></div>`;
    r.querySelector('button').onclick=round;
  }
  round();
}

  quiz(root,'m7',[
    {q:'En la fase 1, ¿cómo se mantiene B?',o:['De menor a mayor','De mayor a menor (como círculo)','Sin orden','Con los pares arriba'],a:1,e:'Cada contenedor entra sobre el mayor valor que sea menor que él, o sobre el máximo si es el nuevo mínimo.'},
    {q:'¿Por qué se usan <code>rr</code> y <code>rrr</code>?',o:['Porque son obligatorias','Porque giran las dos pilas con una sola instrucción y ahorran movimientos','Porque ordenan solas','Porque evitan usar B'],a:1,e:'Dos giros en el mismo sentido cuestan uno si los haces a la vez.'},
    {q:'Al devolver un número de B a A, ¿dónde debe quedar?',o:['Al fondo de A','Justo encima de su sucesor: el menor valor de A que sea mayor que él (o el mínimo de A si no hay ninguno)','En la cima siempre','En medio de A'],a:1,e:'Así A se mantiene ordenada en círculo y sólo falta un giro final.'},
    {q:'Cuando B queda vacía, ¿qué falta?',o:['Nada','Girar A hasta dejar el menor arriba','Un sa','Repetir el algoritmo'],a:1,e:'A está ordenada pero rotada: un <code>ra</code> o <code>rra</code> repetido (el que menos pasos necesite) la deja bien.'}
  ]);
  foot(root,7);
